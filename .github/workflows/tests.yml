# Runs the test suite and the window test on Windows, Linux and macOS.
#
# The window test (redactner.desktop --window-test) opens the real window on each system, puts a built-in
# test document through it and checks the saved copy, so the three browser engines are all exercised.
name: Tests

on:
  push:
    branches: [main, desktop-app]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      # actions are pinned to exact commits, so a changed tag cannot change what runs here
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Libraries the window needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libnss3 libdbus-1-3 \
            libfontconfig1 libasound2t64 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6

      - name: Install
        run: uv sync --extra desktop

      - name: Unit tests
        run: uv run pytest -q

      - name: Self-test (model and Word engine, no window)
        run: uv run python -m redactner.desktop --self-test

      - name: Window test
        if: runner.os != 'Linux'
        run: uv run python -m redactner.desktop --window-test --self-test-output window-test.json

      - name: Window test (Linux, on a virtual screen)
        if: runner.os == 'Linux'
        env:
          QTWEBENGINE_DISABLE_SANDBOX: "1" # the build machine does not permit the engine's own sandbox
          QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu"
        run: xvfb-run -a uv run python -m redactner.desktop --window-test --self-test-output window-test.json

      - name: Result and log of the window test
        if: always()
        shell: bash
        run: |
          cat window-test.json 2>/dev/null || echo "no result file"
          for folder in "$LOCALAPPDATA/RedactNER" "$HOME/.local/state/RedactNER" "$HOME/Library/Application Support/RedactNER"; do
            if [ -d "$folder/logs" ]; then
              tail -n 80 "$folder/logs/redactner.log"
              for extra in console.log crash.log; do
                if [ -s "$folder/logs/$extra" ]; then echo "--- $extra"; cat "$folder/logs/$extra"; fi
              done
            fi
          done

      - name: What Windows recorded, if the window test failed
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          "WebView2 Runtime: " + (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 1, 2; StartTime = (Get-Date).AddMinutes(-20) } -ErrorAction SilentlyContinue |
            Select-Object -First 6 | Format-List TimeCreated, ProviderName, Id, Message
