[project]
name = "redactner"
version = "0.1.0"
description = "Local, context-aware PII redaction for Word documents (fine-tuned NER + validated rules)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.6",
  "transformers>=4.56,<5",
  "datasets>=3.0",
  "accelerate>=1.0",
  "sentencepiece",
  "protobuf",
  "seqeval",
  "numpy",
  "pandas",
  "matplotlib",
  "tqdm",
  "lxml",
  "python-docx>=1.2",
  "phonenumbers",
  "python-stdnum",
  "faker",
  "fastapi",
  "uvicorn",
  "typer",
  "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
  "pytest",
  "httpx",
  "ipykernel",
  "papermill",
  "jupytext",
  "pywin32; sys_platform == 'win32'",
]

[project.scripts]
redactner = "redactner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redactner"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# CUDA 12.8 wheels on Windows and Linux; macOS uses the standard PyPI build (CPU / Apple Silicon)
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
